  const colors = {
    "Chop & Solarize": "#a8451f",
    "Spray / Inject": "#b9862f",
    "Monitor / Healthy": "#2b5b57",
    "Unclassified": "#8a8a8a"
  };

  const coords = data.features.map(f => f.geometry.coordinates);
  const lats = coords.map(c => c[1]);
  const lons = coords.map(c => c[0]);
  const bounds = L.latLngBounds([Math.min(...lats), Math.min(...lons)], [Math.max(...lats), Math.max(...lons)]);

  const map = L.map('map', { zoomControl: true });
  map.fitBounds(bounds, { padding: [24, 24] });

  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  });
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Tiles &copy; Esri'
  }).addTo(map);

  L.control.layers({ "Satellite": sat, "Streets": osm }).addTo(map);

  const counts = {};
  const layer = L.geoJSON(data, {
    pointToLayer: (feature, latlng) => {
      const t = feature.properties.treatment || "Unclassified";
      counts[t] = (counts[t] || 0) + 1;
      return L.circleMarker(latlng, {
        radius: 5,
        color: colors[t] || "#8a8a8a",
        fillColor: colors[t] || "#8a8a8a",
        fillOpacity: 0.85,
        weight: 1
      });
    },
    onEachFeature: (feature, lyr) => {
      const p = feature.properties;
      lyr.bindPopup(
        `<b>Tree #${p.tag}</b><br>` +
        `Crown rating: ${p.crown_rating ?? '—'}<br>` +
        `Exit hole rating: ${p.exit_hole_rating ?? '—'}<br>` +
        `Bark stain rating: ${p.bark_stain_rating ?? '—'}<br>` +
        `<b>Recommended: ${p.treatment}</b>`
      );
    }
  }).addTo(map);

  // Legend
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    let rows = '<b>Treatment Recommendation</b>';
    Object.keys(colors).forEach(k => {
      rows += `<div class="row"><span class="sw" style="background:${colors[k]}"></span> ${k} (${counts[k] || 0})</div>`;
    });
    div.innerHTML = rows;
    return div;
  };
  legend.addTo(map);

  // Stat box
  const stat = L.control({ position: 'topright' });
  stat.onAdd = function () {
    const div = L.DomUtil.create('div', 'stat-box');
    div.innerHTML = `${data.features.length} surveyed trees &middot; Long Potrero Preserve, 2020`;
    return div;
  };
  stat.addTo(map);
